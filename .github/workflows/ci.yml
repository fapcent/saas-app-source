name: CI Pipeline - SaaS App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Ajout des droits pour permettre au pipeline de sauvegarder l'image
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Exécution des tests (Pytest)
        run: |
          pytest tests/

      - name: 🔑 Connexion à GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🐳 Build et Push de l'image Docker
        run: |
          docker build -t ghcr.io/fapcent/saas-app-image:latest .
          docker push ghcr.io/fapcent/saas-app-image:latest
